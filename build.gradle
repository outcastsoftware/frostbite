plugins {
    id 'com.android.library' version '9.3.0' apply false
}

allprojects {
    // JitPack publishes modules as com.github.outcastsoftware.frostbite:<module>:<tag>.
    group = 'com.github.outcastsoftware.frostbite'
    // JitPack passes -Pversion=<tag>; locally the project version is "unspecified", so default it.
    if (version == 'unspecified') version = '0.1.0-SNAPSHOT'
    repositories { google(); mavenCentral() }
}

tasks.register('runtimeBundle', Zip) {
    dependsOn ':api:jar', ':runtime-android:assembleDebug'
    archiveFileName = 'frostbite-runtime.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(project(':api').tasks.named('jar').flatMap { it.archiveFile }) {
        rename { 'api.jar' }
    }
    from(project(':runtime-android').layout.buildDirectory.file('outputs/aar/runtime-android-debug.aar')) {
        rename { 'runtime.aar' }
    }
}
